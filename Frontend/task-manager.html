<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Manager</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --paper: #F1EEE4;
    --paper-line: #DCD6C4;
    --ink: #24333B;
    --ink-soft: #5B6A6F;
    --margin: #C6564A;
    --marigold-bg: #FBEBCF;
    --marigold-fg: #9C6A16;
    --moss: #5C7A5E;
    --moss-bg: #E4EBDF;
    --coral: #C6564A;
    --coral-bg: #F7E1DD;
    --card: #FBF9F2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 32px 16px;
  }

  ::placeholder { color: #9C9686; }

  .wrap { max-width: 640px; margin: 0 auto; }

  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--margin);
    margin-bottom: 2px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 28px;
    margin: 0;
  }

  .stat {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 6px 10px;
    background: var(--card);
    white-space: nowrap;
  }

  form {
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 24px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03);
  }

  #task-input {
    width: 100%;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 4px;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink);
    margin-bottom: 10px;
    font-family: 'Inter', sans-serif;
  }

  .form-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  select, input[type="date"] {
    padding: 8px 10px;
    border-radius: 4px;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }

  #subject-input { flex: 1 1 120px; }
  #due-input { flex: 1 1 140px; }

  button {
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }

  #add-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    flex: 0 0 auto;
  }

  .tabs { display: flex; gap: 4px; margin-bottom: 14px; }

  .tab {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 6px 14px;
    border-radius: 4px;
    border: 1px solid var(--paper-line);
    background: transparent;
    color: var(--ink-soft);
  }

  .tab.active {
    border-color: var(--ink);
    background: var(--ink);
    color: #fff;
  }

  #list {
    position: relative;
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 43px, var(--paper-line) 44px);
    border-left: 2px solid var(--margin);
    padding-left: 20px;
  }

  .empty {
    padding: 24px 0;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .task-row {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 44px;
  }

  .check-btn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    flex: 0 0 auto;
    border: 2px solid var(--ink-soft);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .check-btn.done {
    border-color: var(--moss);
    background: var(--moss);
  }

  .check-btn svg { display: none; }
  .check-btn.done svg { display: block; }

  .subject-tag {
    font-size: 13px;
    font-weight: 600;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    padding: 2px 6px;
    flex: 0 0 auto;
  }

  .task-text {
    flex: 1;
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .task-text.done {
    text-decoration: line-through;
    color: var(--ink-soft);
  }

  .due-badge {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  .delete-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    flex: 0 0 auto;
    padding: 4px;
    display: flex;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <div class="eyebrow">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Assignment planner
      </div>
      <h1>Task Manager</h1>
    </div>
    <div class="stat" id="stat">0/0 done</div>
  </div>

  <form id="add-form">
    <input id="task-input" type="text" placeholder="What do you need to do?" autocomplete="off">
    <div class="form-row">
      <select id="subject-input">
        <option>Math</option>
        <option>Science</option>
        <option>English</option>
        <option>History</option>
        <option>Art</option>
        <option>Other</option>
      </select>
      <input id="due-input" type="date">
      <button id="add-btn" type="submit">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Add
      </button>
    </div>
  </form>

  <div class="tabs">
    <button class="tab active" data-filter="active">active</button>
    <button class="tab" data-filter="done">done</button>
    <button class="tab" data-filter="all">all</button>
  </div>

  <div id="list"></div>
</div>

<script>
  const SUBJECT_COLORS = {
    Math: "#7690A8", Science: "#5C7A5E", English: "#B08A5A",
    History: "#8C6E9A", Art: "#C6564A", Other: "#8A8A80",
  };

  let tasks = [];
  let filter = "active";

  const listEl = document.getElementById("list");
  const statEl = document.getElementById("stat");

  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }

  function daysUntil(dateStr) {
    if (!dateStr) return null;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const due = new Date(dateStr + "T00:00:00");
    return Math.round((due - today) / 86400000);
  }

  function dueBadgeHTML(dateStr) {
    if (!dateStr) return "";
    const d = daysUntil(dateStr);
    let bg = "var(--moss-bg)", fg = "var(--moss)", label;
    if (d < 0) { bg = "var(--coral-bg)"; fg = "var(--coral)"; label = `${Math.abs(d)}d overdue`; }
    else if (d === 0) { bg = "var(--marigold-bg)"; fg = "var(--marigold-fg)"; label = "due today"; }
    else if (d <= 2) { bg = "var(--marigold-bg)"; fg = "var(--marigold-fg)"; label = `due in ${d}d`; }
    else { label = new Date(dateStr + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
    return `<span class="due-badge" style="background:${bg};color:${fg}">${label}</span>`;
  }

  // Base URL for the API. Since we're serving this HTML file
  // FROM the same server, a relative path like "/api/tasks"
  // is enough — the browser fills in http://localhost:3000 itself.
  const API = "/api/tasks";

  // ---- GET /api/tasks: load the list from the server ----
  async function loadTasks() {
    try {
      const res = await fetch(API);
      tasks = await res.json();
    } catch (e) {
      console.error("Failed to load tasks:", e);
    }
    render();
  }

  // ---- POST /api/tasks: ask the server to create a task ----
  async function addTask(text, subject, due) {
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, subject, due }),
      });
      const newTask = await res.json();
      tasks.unshift(newTask);
      render();
    } catch (e) {
      console.error("Failed to add task:", e);
    }
  }

  // ---- PATCH /api/tasks/:id: ask the server to flip "done" ----
  async function toggleDone(id) {
    const current = tasks.find(t => t.id === id);
    if (!current) return;
    try {
      const res = await fetch(`${API}/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ done: !current.done }),
      });
      const updated = await res.json();
      tasks = tasks.map(t => t.id === id ? updated : t);
      render();
    } catch (e) {
      console.error("Failed to update task:", e);
    }
  }

  // ---- DELETE /api/tasks/:id: ask the server to remove it ----
  async function removeTask(id) {
    try {
      await fetch(`${API}/${id}`, { method: "DELETE" });
      tasks = tasks.filter(t => t.id !== id);
      render();
    } catch (e) {
      console.error("Failed to delete task:", e);
    }
  }

  function render() {
    const visible = tasks
      .filter(t => filter === "all" ? true : filter === "done" ? t.done : !t.done)
      .sort((a, b) => {
        if (a.due && b.due) return a.due.localeCompare(b.due);
        if (a.due) return -1;
        if (b.due) return 1;
        return b.createdAt - a.createdAt;
      });

    const doneCount = tasks.filter(t => t.done).length;
    statEl.textContent = `${doneCount}/${tasks.length} done`;

    if (visible.length === 0) {
      const msg = filter === "done" ? "Nothing finished yet."
        : filter === "active" ? "No tasks — add one above to get started."
        : "Your list is empty.";
      listEl.innerHTML = `<div class="empty">${msg}</div>`;
      return;
    }

    listEl.innerHTML = visible.map(t => `
      <div class="task-row" data-id="${t.id}">
        <button class="check-btn ${t.done ? "done" : ""}" data-action="toggle" aria-label="${t.done ? "Mark as not done" : "Mark as done"}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
        <span class="subject-tag" style="color:${SUBJECT_COLORS[t.subject] || "#8A8A80"}">${t.subject}</span>
        <span class="task-text ${t.done ? "done" : ""}">${escapeHTML(t.text)}</span>
        ${dueBadgeHTML(t.due)}
        <button class="delete-btn" data-action="delete" aria-label="Delete task">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6h12z"/></svg>
        </button>
      </div>
    `).join("");
  }

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("add-form").addEventListener("submit", e => {
    e.preventDefault();
    const textInput = document.getElementById("task-input");
    const subjectInput = document.getElementById("subject-input");
    const dueInput = document.getElementById("due-input");
    if (!textInput.value.trim()) return;
    addTask(textInput.value.trim(), subjectInput.value, dueInput.value);
    textInput.value = "";
    dueInput.value = "";
  });

  listEl.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const row = e.target.closest(".task-row");
    const id = row.dataset.id;
    if (btn.dataset.action === "toggle") toggleDone(id);
    if (btn.dataset.action === "delete") removeTask(id);
  });

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      filter = tab.dataset.filter;
      render();
    });
  });

  loadTasks();
</script>

</body>
</html>
